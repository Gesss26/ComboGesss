<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ComboGesss — Statistiche Calcio Europee</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      background-color: #0b0f17;
      color: #f1f5f9;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-card {
      background: linear-gradient(180deg, rgba(20, 27, 41, 0.92) 0%, rgba(15, 21, 33, 0.96) 100%);
      border: 1px solid rgba(148, 163, 184, 0.14);
    }
    .form-pill {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .form-W {
      background: rgba(16, 185, 129, 0.22);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.45);
    }
    .form-D {
      background: rgba(245, 158, 11, 0.2);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.45);
    }
    .form-L {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.45);
    }

    /* Colorazione percentuali */
    .pct-red {
      color: #f87171 !important;
    }
    .pct-white {
      color: #f8fafc !important;
    }
    .pct-green {
      color: #34d399 !important;
    }
    .pct-gold {
      color: #facc15 !important;
    }

    @keyframes cgGoldPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.45), 0 0 14px rgba(250, 204, 21, 0.28);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 0 5px rgba(250, 204, 21, 0.12), 0 0 22px rgba(250, 204, 21, 0.55);
        transform: scale(1.02);
      }
    }

    @keyframes cgBombBounce {
      0%, 100% {
        transform: translateY(0) rotate(-6deg) scale(1);
      }
      50% {
        transform: translateY(-2px) rotate(8deg) scale(1.14);
      }
    }

    .flag-bomb {
      color: #facc15 !important;
      border-color: rgba(250, 204, 21, 0.75) !important;
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.22), rgba(245, 158, 11, 0.12)) !important;
      animation: cgGoldPulse 1.6s infinite ease-in-out;
    }

    .flag-bomb .bomb-icon {
      display: inline-block;
      animation: cgBombBounce 1.1s infinite ease-in-out;
    }


    /* Interruttore doppia visualizzazione */
    .view-switch {
      position: relative;
      width: 44px;
      height: 24px;
      border-radius: 999px;
      background: #1e293b;
      border: 1px solid #334155;
      transition: background 0.2s, border-color 0.2s;
      cursor: pointer;
      flex-shrink: 0;
    }
    .view-switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #e2e8f0;
      transition: transform 0.2s, background 0.2s;
    }
    .view-switch[aria-checked="true"] {
      background: rgba(34, 211, 238, 0.30);
      border-color: rgba(103, 232, 249, 0.85);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.45);
    }
    .view-switch[aria-checked="true"]::after {
      transform: translateX(20px);
      background: #67e8f9;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }

    /* =====================================================
       TEMA FUTURISTICO — blu / celeste / ciano
       ===================================================== */
    :root {
      --cg-cyan: #22d3ee;
      --cg-ice: #a5f3fc;
      --cg-sky: #38bdf8;
      --cg-blue: #3b82f6;
    }

    body {
      font-family: "Exo 2", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #e6f4ff;
      background-color: #020817;
      background-image:
        radial-gradient(1100px 620px at 8% -8%, rgba(34, 211, 238, 0.24), transparent 60%),
        radial-gradient(900px 640px at 96% 8%, rgba(59, 130, 246, 0.26), transparent 60%),
        radial-gradient(900px 700px at 55% 112%, rgba(14, 165, 233, 0.20), transparent 62%),
        linear-gradient(160deg, #020617 0%, #061634 45%, #031b30 100%);
      background-attachment: fixed;
      position: relative;
    }

    /* griglia tecnologica */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(103, 232, 249, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(103, 232, 249, 0.07) 1px, transparent 1px),
        linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
      background-size: 48px 48px, 48px 48px, 12px 12px, 12px 12px;
      -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 25%, transparent 80%);
      mask-image: radial-gradient(ellipse at 50% 30%, #000 25%, transparent 80%);
    }

    /* alone luminoso che si muove lentamente */
    body::after {
      content: "";
      position: fixed;
      width: 70vmax;
      height: 70vmax;
      left: -20vmax;
      top: -25vmax;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, transparent 60%);
      animation: cgOrbDrift 26s ease-in-out infinite alternate;
    }
    @keyframes cgOrbDrift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(70vw, 35vh) scale(1.15); }
    }

    /* ===== NUOVO layer circuiti + scanline ===== */
    #techBgLayer {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    #techBgLayer::before {
      content: "";
      position: absolute;
      inset: -10%;
      background-image:
        repeating-linear-gradient(45deg, rgba(34, 211, 238, 0.06) 0 1px, transparent 1px 60px),
        repeating-linear-gradient(-45deg, rgba(59, 130, 246, 0.05) 0 1px, transparent 1px 80px);
      mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 20%, transparent 75%);
      animation: cgCircuitShift 40s linear infinite;
    }
    @keyframes cgCircuitShift {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(60px, 60px); }
    }
    #techBgLayer::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(34, 211, 238, 0.10) 0 2px, transparent 3px),
        radial-gradient(circle at 70% 60%, rgba(59, 130, 246, 0.10) 0 2px, transparent 3px),
        radial-gradient(circle at 40% 80%, rgba(103, 232, 249, 0.10) 0 2px, transparent 3px),
        radial-gradient(circle at 85% 20%, rgba(34, 211, 238, 0.08) 0 2px, transparent 3px);
      background-size: 220px 220px, 280px 280px, 180px 180px, 240px 240px;
      animation: cgDotDrift 30s linear infinite;
      opacity: 0.9;
    }
    @keyframes cgDotDrift {
      0%   { background-position: 0 0, 0 0, 0 0, 0 0; }
      100% { background-position: 220px 220px, -280px 280px, 180px -180px, -240px -240px; }
    }

    /* scanline orizzontale che scorre */
    #techBgLayer .cgScanline {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.6), transparent);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.6);
      animation: cgScan 8s linear infinite;
    }
    @keyframes cgScan {
      0%   { top: 0%; opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      body::after,
      #techBgLayer::before,
      #techBgLayer::after,
      #techBgLayer .cgScanline { animation: none; }
    }

    main { position: relative; z-index: 1; }

    h1, h2, h3, #liveClockTime {
      font-family: Orbitron, "Exo 2", system-ui, sans-serif;
      letter-spacing: 0.04em;
    }
    h1 {
      background: linear-gradient(90deg, #ffffff, #a5f3fc 55%, #38bdf8);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(34, 211, 238, 0.45));
    }

    /* Header */
    header {
      background: linear-gradient(180deg, rgba(2, 10, 28, 0.92), rgba(4, 22, 48, 0.78)) !important;
      border-bottom: 1px solid rgba(34, 211, 238, 0.30) !important;
      box-shadow: 0 8px 32px rgba(14, 165, 233, 0.12), 0 1px 0 rgba(165, 243, 252, 0.08);
    }
    #liveClockTime {
      color: #a5f3fc !important;
      text-shadow: 0 0 12px rgba(34, 211, 238, 0.75);
      font-size: 1.05rem;
    }
    #liveClockDate { color: #7dd3fc; }

    /* Card in vetro con angoli HUD */
    .glass-card {
      position: relative;
      background: linear-gradient(180deg, rgba(9, 32, 64, 0.70) 0%, rgba(4, 16, 38, 0.82) 100%);
      border: 1px solid rgba(56, 189, 248, 0.24);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(165, 243, 252, 0.08), 0 0 24px rgba(14, 165, 233, 0.07);
    }
    .glass-card::before,
    .glass-card::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      border: 0 solid rgba(103, 232, 249, 0.85);
    }
    .glass-card::before {
      top: -1px; left: -1px;
      border-top-width: 2px; border-left-width: 2px;
      border-top-left-radius: inherit;
    }
    .glass-card::after {
      bottom: -1px; right: -1px;
      border-bottom-width: 2px; border-right-width: 2px;
      border-bottom-right-radius: inherit;
    }
    .glass-card:hover {
      border-color: rgba(103, 232, 249, 0.60);
      box-shadow: inset 0 1px 0 rgba(165, 243, 252, 0.12), 0 0 26px rgba(34, 211, 238, 0.20);
    }

    /* Sfondi/bordi/testi "slate" -> blu notte con riflessi ciano */
    [class^="bg-slate-950"], [class*=" bg-slate-950"] { background-color: rgba(2, 12, 30, 0.80) !important; }
    [class^="bg-slate-900"], [class*=" bg-slate-900"] { background-color: rgba(7, 26, 54, 0.72) !important; }
    [class^="bg-slate-800"], [class*=" bg-slate-800"] { background-color: rgba(10, 38, 74, 0.80) !important; }
    .hover\:bg-slate-700:hover { background-color: rgba(14, 64, 112, 0.95) !important; }
    .hover\:bg-slate-900\/80:hover { background-color: rgba(10, 44, 88, 0.70) !important; }

    [class^="border-slate-"], [class*=" border-slate-"] { border-color: rgba(56, 189, 248, 0.22) !important; }
    [class*="hover:border-"]:hover { border-color: rgba(103, 232, 249, 0.60) !important; }
    select:focus { border-color: #22d3ee !important; box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.25); outline: none; }

    .text-slate-200 { color: #d7ecff !important; }
    .text-slate-300 { color: #b4d6f2 !important; }
    .text-slate-400 { color: #86b3d8 !important; }
    .text-slate-500 { color: #5f8db3 !important; }
    .text-slate-600 { color: #3f6c92 !important; }

    /* Pulsanti principali */
    .bg-cyan-600 {
      background-image: linear-gradient(135deg, #0891b2, #2563eb) !important;
      box-shadow: 0 0 16px rgba(34, 211, 238, 0.28);
    }
    .hover\:bg-cyan-500:hover {
      background-image: linear-gradient(135deg, #22d3ee, #3b82f6) !important;
      box-shadow: 0 0 22px rgba(34, 211, 238, 0.50);
    }
    .bg-cyan-500\/15, .bg-cyan-500\/20 {
      box-shadow: inset 0 0 14px rgba(34, 211, 238, 0.10);
    }

    /* Partite di oggi: card riempita di ciano ghiaccio tenue */
    .today-match {
      background: linear-gradient(180deg, rgba(165, 243, 252, 0.22) 0%, rgba(103, 232, 249, 0.10) 100%) !important;
      border-color: rgba(165, 243, 252, 0.45) !important;
      box-shadow: inset 0 0 22px rgba(165, 243, 252, 0.08), 0 0 18px rgba(103, 232, 249, 0.16);
    }
    .today-match:hover {
      background: linear-gradient(180deg, rgba(165, 243, 252, 0.30) 0%, rgba(103, 232, 249, 0.16) 100%) !important;
    }

    /* Card partita già giocata: sfondo grigio */
    .match-played {
      background: linear-gradient(180deg, rgba(71, 85, 105, 0.55) 0%, rgba(51, 65, 85, 0.65) 100%) !important;
      border-color: rgba(148, 163, 184, 0.45) !important;
      box-shadow: inset 0 1px 0 rgba(226, 232, 240, 0.08), 0 0 18px rgba(100, 116, 139, 0.25);
    }
    .match-played:hover {
      background: linear-gradient(180deg, rgba(100, 116, 139, 0.60) 0%, rgba(71, 85, 105, 0.70) 100%) !important;
      border-color: rgba(203, 213, 225, 0.60) !important;
    }
    /* Riquadro risultato in evidenza */
    .match-result-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: 0.5px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.55);
      color: #f8fafc;
      box-shadow: 0 0 10px rgba(148, 163, 184, 0.25);
    }
    .match-result-badge .ft-label {
      font-size: 10px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    ::selection { background: rgba(34, 211, 238, 0.35); color: #fff; }
    ::-webkit-scrollbar-track { background: #04112a; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #0e7490, #1d4ed8); border-radius: 999px; }

    /* Splashscreen iniziale */
    #splashScreen {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 45%, #0b2a4a 0%, #04112a 55%, #020817 100%);
      opacity: 1; visibility: visible;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #splashScreen.splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #splashScreen img {
      width: min(60vw, 360px); height: auto;
      animation: splashIn 0.9s ease-out both;
      filter: drop-shadow(0 0 28px rgba(34, 211, 238, 0.35));
    }
    @keyframes splashIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Splashscreen: visibile 3 secondi, poi mostra la home -->
  <div id="splashScreen" aria-hidden="true">
    <img src="Splashscreen.png" alt="GesssAI-Pro" />
  </div>
  <script>
    setTimeout(function () {
      var el = document.getElementById("splashScreen");
      if (!el) return;
      el.classList.add("splash-hide");
      setTimeout(function () { el.remove(); }, 700);
    }, 3000);
  </script>

  <!-- Layer decorativo tecnologico -->
  <div id="techBgLayer" aria-hidden="true"></div>

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/90 backdrop-blur sticky top-0 z-30">
    <div class="max-w-[1700px] mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-cyan-500/15 border border-cyan-400/30 flex items-center justify-center text-2xl">
          ⚽
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="text-xl font-extrabold tracking-tight text-white">ComboGesss</h1>
            <span class="text-[11px] uppercase tracking-wider px-2 py-0.5 rounded-full bg-cyan-500/15 text-cyan-300 border border-cyan-500/30">
              Europa 2026/27
            </span>
          </div>
          <p id="dataStatusText" class="text-xs text-slate-400">Inizializzazione dati in corso...</p>
        </div>
      </div>

      <div class="flex flex-col items-end gap-2 ml-auto">
      <div id="liveClock" class="text-right leading-tight">
        <div id="liveClockDate" class="text-[11px] uppercase tracking-wider text-slate-400"></div>
        <div id="liveClockTime" class="text-lg font-extrabold text-cyan-300 tabular-nums"></div>
      </div>
      <div class="flex items-center gap-2">
        <button id="reloadDataBtn" type="button" onclick="autoLoadComboGesssData(true)" class="px-3 py-2 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
          🔄 Aggiorna Dati
        </button>
        <label class="px-3 py-2 rounded-lg text-xs font-semibold bg-cyan-600 hover:bg-cyan-500 text-white cursor-pointer transition">
          📥 Carica Excel/CSV
          <input id="manualFileInput" type="file" accept=".xlsx,.xls,.csv" multiple class="hidden" onchange="handleManualUpload(event)" />
        </label>
      </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-[1700px] w-full mx-auto px-4 py-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">

    <!-- Colonna 1: Nazioni con bandiere -->
    <section class="lg:col-span-2 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">1. Nazioni</h2>
        <span id="countriesSummaryLabel" class="text-[11px] text-slate-500">Seleziona paese</span>
      </div>
      <div id="countriesList" class="space-y-2 max-h-[75vh] overflow-y-auto pr-1"></div>
    </section>

    <!-- Colonna 2: Campionati della nazione selezionata -->
    <section class="lg:col-span-3 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">2. Campionati</h2>
        <div id="selectedCountryBadge" class="flex items-center gap-1.5 text-xs text-cyan-400 font-semibold"></div>
      </div>
      <div id="leaguesList" class="space-y-2.5"></div>
    </section>

    <!-- Colonna 3: Giornata completa -->
    <section class="lg:col-span-7 space-y-4">
      <div class="glass-card rounded-2xl p-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <div id="currentLeagueTitle" class="flex items-center gap-2 text-lg font-bold text-white"></div>
            <p id="currentLeagueSubtitle" class="text-xs text-slate-400 mt-0.5">Intera giornata ordinata per differenza di forma</p>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" onclick="changeRound(-1)" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-slate-700">◀</button>
            <select id="roundSelect" onchange="selectRound(this.value)" class="px-3 py-1.5 rounded-lg bg-slate-900 text-xs font-semibold text-white border border-slate-700 focus:outline-none focus:border-cyan-500"></select>
            <button type="button" onclick="changeRound(1)" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-slate-700">▶</button>
          </div>
        </div>

        <!-- Interruttore doppia visualizzazione -->
        <div class="mt-3 pt-3 border-t border-slate-800 flex flex-wrap items-center gap-3 text-xs font-semibold">
          <span id="viewLabelForm" class="transition">📊 Differenza forma</span>
          <button id="viewModeSwitch" type="button" role="switch" aria-checked="false" aria-label="Cambia visualizzazione" onclick="toggleViewMode()" class="view-switch"></button>
          <span id="viewLabelChrono" class="transition">🕒 Ordine cronologico</span>
          <span class="text-[11px] font-normal text-slate-500 flex items-center gap-1.5">
            <span class="inline-block w-3 h-3 rounded-sm bg-cyan-200/40 border border-cyan-200/50"></span> partite di oggi
          </span>
          <span class="text-[11px] font-normal text-slate-500 flex items-center gap-1.5">
            <span class="inline-block w-3 h-3 rounded-sm bg-slate-500/50 border border-slate-400/60"></span> partite giocate
          </span>
        </div>
      </div>

      <div id="matchesList" class="space-y-2.5"></div>
    </section>
  </main>

  <script>
    const NATIONS = [
      {
        id: "Italia",
        name: "Italia",
        flagUrl: "https://flagcdn.com/w40/it.png",
        emojiFlag: "🇮🇹",
        leagues: [
          { code: "I1", tier: "Serie A", name: "Serie A", matchesPerRound: 10 },
          { code: "I2", tier: "Serie B", name: "Serie B", matchesPerRound: 10 }
        ]
      },
      {
        id: "Inghilterra",
        name: "Inghilterra",
        flagUrl: "https://flagcdn.com/w40/gb-eng.png",
        emojiFlag: "🏴󠁧󠁢󠁥󠁮󠁧󠁿",
        leagues: [
          { code: "E0", tier: "1ª Div.", name: "Premier League", matchesPerRound: 10 },
          { code: "E1", tier: "2ª Div.", name: "Championship", matchesPerRound: 12 },
          { code: "E2", tier: "3ª Div.", name: "League One", matchesPerRound: 12 },
          { code: "E3", tier: "4ª Div.", name: "League Two", matchesPerRound: 12 },
          { code: "EC", tier: "5ª Div.", name: "National League", matchesPerRound: 12 }
        ]

    function getTodayStr() {
      const d = new Date();
      return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
    }

    function isPastDate(dateStr) {
      const dm = String(dateStr || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (!dm) return false;
      const d = new Date(+dm[3], +dm[2] - 1, +dm[1]);
      const t = new Date(); t.setHours(0, 0, 0, 0);
      return d < t;
    }

    function matchSortKey(m) {
      const dm = String(m.date || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (!dm) return Number.POSITIVE_INFINITY;
      const tm = String(m.time || "").match(/^(\d{1,2}):(\d{2})/);
      const hh = tm ? parseInt(tm[1], 10) : 0;
      const mi = tm ? parseInt(tm[2], 10) : 0;
      return Date.UTC(parseInt(dm[3], 10), parseInt(dm[2], 10) - 1, parseInt(dm[1], 10), hh, mi);
    }

    function clampPct(val) {
      const n = Number(val);
      if (!Number.isFinite(n)) return 0;
      return Math.max(0, Math.min(100, n));
    }

    function formatPct(num) {
      const fixed = clampPct(num).toFixed(1);
      return `${fixed.endsWith(".0") ? fixed.slice(0, -2) : fixed.replace(".", ",")}%`;
    }

    function getPctColorClass(val) {
      const p = clampPct(val);
      if (p >= 90) return "pct-gold";
      if (p >= 66.67) return "pct-green";
      if (p >= 33.34) return "pct-white";
      return "pct-red";
    }

    function renderPctText(val, extraClasses = "") {

    // Normalizza sempre in DD/MM/AAAA (gestendo DD/MM/AAAA, MM/GG/AAAA, AAAA-MM-GG, Date e seriali Excel)
    function formatExcelDate(val) {
      if (val === null || val === undefined || val === "") return "";

      if (val instanceof Date && Number.isFinite(val.getTime())) {
        const dd = String(val.getDate()).padStart(2, "0");
        const mm = String(val.getMonth() + 1).padStart(2, "0");
        const yyyy = val.getFullYear();
        return `${dd}/${mm}/${yyyy}`;
      }

      if (typeof val === "number" && Number.isFinite(val)) {
        const serialDays = Math.floor(val);
        const utcMs = Date.UTC(1899, 11, 30) + serialDays * 86400000;
        const d = new Date(utcMs);
        const dd = String(d.getUTCDate()).padStart(2, "0");
        const mm = String(d.getUTCMonth() + 1).padStart(2, "0");
        const yyyy = d.getUTCFullYear();
        return `${dd}/${mm}/${yyyy}`;
      }

      const str = String(val).trim();
      if (!str) return "";

      if (/^\d+(\.\d+)?$/.test(str)) {
        return formatExcelDate(parseFloat(str));
      }

      const datePart = str.split(/[\sT]+/)[0];

      // AAAA-MM-GG oppure AAAA/MM/GG
      const ymd = datePart.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
      if (ymd) {
        const yyyy = ymd[1];
        const mm = String(parseInt(ymd[2], 10)).padStart(2, "0");
        const dd = String(parseInt(ymd[3], 10)).padStart(2, "0");
        return `${dd}/${mm}/${yyyy}`;
      }

      // Coppie a due separatori: riconosce sia DD/MM/AAAA che MM/GG/AAAA (es. 11/22/2026 -> 22/11/2026)
      const parts = datePart.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
      if (parts) {
        const p1 = parseInt(parts[1], 10);
        const p2 = parseInt(parts[2], 10);
        let yyyy = parseInt(parts[3], 10);
        if (yyyy < 100) yyyy += yyyy >= 70 ? 1900 : 2000;

        let day = p1;
        let month = p2;

        if (p2 > 12 && p1 >= 1 && p1 <= 12) {
          month = p1;
          day = p2;
        }

        const dd = String(day).padStart(2, "0");
        const mm = String(month).padStart(2, "0");
        return `${dd}/${mm}/${yyyy}`;
      }

      return str;
    }

    function formatExcelTime(val) {
      if (val === null || val === undefined || val === "") return "";
      if (typeof val === "number" && Number.isFinite(val)) {
        const dayFraction = val % 1;
        const totalMinutes = Math.round(dayFraction * 24 * 60) % (24 * 60);
        const hh = String(Math.floor(totalMinutes / 60)).padStart(2, "0");
        const mm = String(totalMinutes % 60).padStart(2, "0");
        return `${hh}:${mm}`;
      }
      const str = String(val).trim();
      if (/^\d+(\.\d+)?$/.test(str)) {
        return formatExcelTime(parseFloat(str));
      }
      return str.slice(0, 5);
    }

    function extractBookOdds(row) {
      const odd1 = parseFloat(row.B365H ?? row.PSH ?? row.AvgH ?? row.MaxH ?? row["1"]);
      const oddX = parseFloat(row.B365D ?? row.PSD ?? row.AvgD ?? row.MaxD ?? row["X"]);
      const odd2 = parseFloat(row.B365A ?? row.PSA ?? row.AvgA ?? row.MaxA ?? row["2"]);
      const oddOv = parseFloat(row["B365>2.5"] ?? row["Avg>2.5"] ?? row.BbMxOver25 ?? row["Over 2,5"]);
      const oddUn = parseFloat(row["B365<2.5"] ?? row["Avg<2.5"] ?? row.BbMxUnder25 ?? row["Under 2,5"]);

      const bookOdds = {};
      if (Number.isFinite(odd1) && odd1 > 1) bookOdds["1"] = odd1;
      if (Number.isFinite(oddX) && oddX > 1) bookOdds["X"] = oddX;
      if (Number.isFinite(odd2) && odd2 > 1) bookOdds["2"] = odd2;
      if (Number.isFinite(oddOv) && oddOv > 1) bookOdds["Ov25"] = oddOv;
      if (Number.isFinite(oddUn) && oddUn > 1) bookOdds["Un25"] = oddUn;
      return bookOdds;
    }

    function computeFormScore(resultsArr) {
      const last5 = (resultsArr || []).slice(-5);
      let score = 0;
      for (const r of last5) {
        if (r === "W") score += 20;
        else if (r === "D") score += 7.5;
      }
      return Number(score.toFixed(1));
    }

    function buildDemoRounds() {
      const patternPool = [
        ["W", "W", "D", "W", "L"],
        ["D", "W", "L", "W", "D"],
        ["L", "D", "W", "L", "W"],
        ["W", "L", "L", "D", "W"],
        ["D", "D", "L", "W", "L"],
        ["W", "W", "W", "D", "W"]
      ];

      const roundsMap = {};
      for (const n of NATIONS) {
        for (const lg of n.leagues) {
          const rawTeams = DEMO_TEAMS_BY_LEAGUE[lg.code] || [];
          const needed = Math.max(lg.matchesPerRound * 2, rawTeams.length);
          const teams = rawTeams.length >= needed
            ? rawTeams
            : Array.from({ length: needed }, (_, i) => rawTeams[i % Math.max(1, rawTeams.length)] || `${lg.name} ${i + 1}`);

          const rounds = [];
          for (let r = 1; r <= 3; r++) {
            const matches = [];
            for (let m = 0; m < lg.matchesPerRound; m++) {
              const idx1 = (m * 2 + (r - 1) * 2) % teams.length;
              const idx2 = (m * 2 + 1 + (r - 1) * 2) % teams.length;
              const home = teams[idx1];
              const away = teams[idx2 === idx1 ? (idx2 + 1) % teams.length : idx2];

              const homeFormArr = patternPool[(m + r) % patternPool.length];
              const awayFormArr = patternPool[(m + r + 2) % patternPool.length];
              const homeForm = computeFormScore(homeFormArr);
              const awayForm = computeFormScore(awayFormArr);
              const diffForm = Math.abs(homeForm - awayForm);

              matches.push({
                id: `${lg.code}-R${r}-${m}`,
                home,
                away,
                date: "22/11/2026",
                time: m < 5 ? "15:00" : "18:00",
                ftResult: r === 1 ? `${(m + 1) % 3} - ${m % 2}` : null,
                homeFormArr,
                awayFormArr,
                homeForm,
                awayForm,
                diffForm,
                bookOdds: {}
              });
            }
            matches.sort((a, b) => b.diffForm - a.diffForm);
            rounds.push({ roundNumber: r, label: r === 3 ? `Giornata ${r} (Prossime)` : `Giornata ${r}`, matches });
          }
          roundsMap[lg.code] = rounds;
        }
      }
      return roundsMap;
    }

    function organizeMatchesIntoRounds(resultsRows, fixturesRows) {
      const baseDemo = buildDemoRounds();
      const groupedByLeague = {};
      const teamHistoryByDiv = {};

      const cleanResults = (resultsRows || []).map(row => {
        const div = String(row.Div || row.DivCode || "").trim().toUpperCase();
        const home = String(row.HomeTeam || row.Home || "").trim();
        const away = String(row.AwayTeam || row.Away || "").trim();
        const ftr = String(row.FTR || "").trim().toUpperCase();
        return {
          div,
          home,
          away,
          date: formatExcelDate(row.Date),
          time: formatExcelTime(row.Time),
          ftResult: (row.FTHG !== undefined && row.FTHG !== "" && row.FTAG !== undefined && row.FTAG !== "")
            ? `${row.FTHG} - ${row.FTAG}` : null,
          ftr,
          bookOdds: extractBookOdds(row),
          isFixture: false
        };
      }).filter(x => x.div && x.home && x.away);

      for (const item of cleanResults) {
        if (!teamHistoryByDiv[item.div]) teamHistoryByDiv[item.div] = {};
        if (!teamHistoryByDiv[item.div][item.home]) teamHistoryByDiv[item.div][item.home] = [];
        if (!teamHistoryByDiv[item.div][item.away]) teamHistoryByDiv[item.div][item.away] = [];

        if (item.ftr === "H") {
          teamHistoryByDiv[item.div][item.home].push("W");
          teamHistoryByDiv[item.div][item.away].push("L");
        } else if (item.ftr === "A") {
          teamHistoryByDiv[item.div][item.home].push("L");
          teamHistoryByDiv[item.div][item.away].push("W");
        } else if (item.ftr === "D") {
          teamHistoryByDiv[item.div][item.home].push("D");
          teamHistoryByDiv[item.div][item.away].push("D");
        }
      }

      const cleanFixtures = (fixturesRows || []).map(row => {
        const div = String(row.Div || row.DivCode || "").trim().toUpperCase();
        const home = String(row.HomeTeam || row.Home || "").trim();
        const away = String(row.AwayTeam || row.Away || "").trim();
        return {
          div,
          home,
          away,
          date: formatExcelDate(row.Date),
          time: formatExcelTime(row.Time),
          ftResult: (row.FTHG !== undefined && row.FTHG !== "" && row.FTAG !== undefined && row.FTAG !== "")
            ? `${row.FTHG} - ${row.FTAG}` : null,
          bookOdds: extractBookOdds(row),
          isFixture: true
        };
      }).filter(x => x.div && x.home && x.away);

      // Se una partita è presente sia nei risultati sia nelle future (già giocata ma
      // ancora nel file fixtures), tengo una sola copia e le associo il risultato.
      const dmyToTime = (str) => {
        const m = String(str || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        return m ? Date.UTC(+m[3], +m[2] - 1, +m[1]) : null;
      };
      const resultsByKey = {};
      for (const r of cleanResults) {
        const k = `${r.div}|${r.home.toLowerCase()}|${r.away.toLowerCase()}`;
        (resultsByKey[k] = resultsByKey[k] || []).push(r);
      }
      for (let i = cleanFixtures.length - 1; i >= 0; i--) {
        const f = cleanFixtures[i];
        const cands = resultsByKey[`${f.div}|${f.home.toLowerCase()}|${f.away.toLowerCase()}`] || [];
        const ft = dmyToTime(f.date);
        const hit = cands.find(r => {
          const rt = dmyToTime(r.date);
          return ft === null || rt === null || Math.abs(ft - rt) <= 5 * 86400000;
        });
        if (hit) {
          if (!hit.ftResult && f.ftResult) hit.ftResult = f.ftResult;
          cleanFixtures.splice(i, 1);
        }
      }

      const allItems = [...cleanResults, ...cleanFixtures];
      if (!allItems.length) return baseDemo;

      for (const item of allItems) {
        if (!groupedByLeague[item.div]) groupedByLeague[item.div] = [];
        groupedByLeague[item.div].push(item);
      }

      const fallbackCycle = [["W", "D", "W", "L", "W"], ["D", "W", "L", "D", "W"], ["L", "W", "D", "W", "L"]];
      const finalRounds = {};

      for (const n of NATIONS) {
        for (const lg of n.leagues) {
          const list = groupedByLeague[lg.code] || [];
          if (!list.length) {
            finalRounds[lg.code] = baseDemo[lg.code];
            continue;
          }

          const size = lg.matchesPerRound || 10;
          const totalRounds = Math.max(1, Math.ceil(list.length / size));
          const rounds = [];

          for (let r = 0; r < totalRounds; r++) {
            const slice = list.slice(r * size, (r + 1) * size).map((m, idx) => {
              const histMap = teamHistoryByDiv[lg.code] || {};
              const homeFormArr = (histMap[m.home] && histMap[m.home].length)
                ? histMap[m.home].slice(-5)
                : fallbackCycle[(r + idx) % fallbackCycle.length];
              const awayFormArr = (histMap[m.away] && histMap[m.away].length)
                ? histMap[m.away].slice(-5)
                : fallbackCycle[(r + idx + 1) % fallbackCycle.length];

              const homeForm = computeFormScore(homeFormArr);
              const awayForm = computeFormScore(awayFormArr);
              const diffForm = Math.abs(homeForm - awayForm);

              return {
                ...m,
                id: `${lg.code}-${r + 1}-${idx}`,
                homeFormArr,
                awayFormArr,
                homeForm,
                awayForm,
                diffForm
              };
            });

            slice.sort((a, b) => b.diffForm - a.diffForm);

            const roundNum = r + 1;
            const isLast = roundNum === totalRounds;
            rounds.push({
              roundNumber: roundNum,
              label: isLast ? `Giornata ${roundNum} (Prossime)` : `Giornata ${roundNum}`,
              matches: slice
            });
          }
          finalRounds[lg.code] = rounds;
        }
      }

      return finalRounds;
    }

    async function autoLoadComboGesssData(forceReload = false) {
      const statusEl = document.getElementById("dataStatusText");
      statusEl.textContent = "Caricamento automatico file da ./data/...";

      const sources = [
        { path: "./data/all_leagues.csv", key: "combogesss_results", target: "resultsRows" },
        { path: "./data/fixtures.xlsx", key: "combogesss_fixtures", target: "fixturesRows" }
      ];

      let loadedAny = false;

      for (const src of sources) {
        try {
          const resp = await fetch(`${src.path}?t=${Date.now()}`, { cache: "no-store" });
          if (!resp.ok) continue;

          const buf = await resp.arrayBuffer();
          const wb = XLSX.read(buf, { type: "array", cellDates: false });
          const sheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: false });

          if (Array.isArray(rows) && rows.length > 0) {
            state[src.target] = rows;
            localStorage.setItem(src.key, JSON.stringify(rows));
            loadedAny = true;
          }
        } catch (err) {
          console.warn(`Impossibile leggere ${src.path}:`, err);
        }
      }

      if (!loadedAny && !forceReload) {
        try {
          const cachedRes = JSON.parse(localStorage.getItem("combogesss_results") || "[]");
          const cachedFix = JSON.parse(localStorage.getItem("combogesss_fixtures") || "[]");
          if (cachedRes.length || cachedFix.length) {
            state.resultsRows = cachedRes;
            state.fixturesRows = cachedFix;
            loadedAny = true;
          }
        } catch (_) {}
      }

      state.roundsByLeague = organizeMatchesIntoRounds(state.resultsRows, state.fixturesRows);
      const leagueRounds = state.roundsByLeague[state.selectedLeagueCode] || [];
      state.selectedRound = leagueRounds.length ? leagueRounds[leagueRounds.length - 1].roundNumber : 1;

      if (loadedAny) {
        statusEl.textContent = `Dati caricati: ${state.resultsRows.length} risultati • ${state.fixturesRows.length} partite future`;
      } else {
        statusEl.textContent = "Anteprima dati (esegui update_combogesss_data.py o carica Excel/CSV)";
      }

      renderAll();
    }

    async function handleManualUpload(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;

      for (const file of files) {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array", cellDates: false });

        let combinedRows = [];
        for (const sheetName of wb.SheetNames) {
          const sheet = wb.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: false });
          for (const r of rows) {
            if (!r.Div && !r.DivCode && sheetName) {
              r.Div = sheetName;
            }
            combinedRows.push(r);
          }
        }

        if (file.name.toLowerCase().includes("fix")) {
          state.fixturesRows = combinedRows;
          localStorage.setItem("combogesss_fixtures", JSON.stringify(combinedRows));
        } else {
          state.resultsRows = [...state.resultsRows, ...combinedRows];
          localStorage.setItem("combogesss_results", JSON.stringify(state.resultsRows));
        }
      }

      state.roundsByLeague = organizeMatchesIntoRounds(state.resultsRows, state.fixturesRows);
      document.getElementById("dataStatusText").textContent =
        `Importati ${files.length} file (${state.resultsRows.length} risultati • ${state.fixturesRows.length} future)`;
      renderAll();
    }

    function renderCountries() {
      const container = document.getElementById("countriesList");
      const summary = document.getElementById("countriesSummaryLabel");
      if (summary) summary.textContent = `${NATIONS.length} paesi`;

      container.innerHTML = NATIONS.map(nation => {
        const active = nation.id === state.selectedCountry;
        return `
          <button
            type="button"
            onclick="selectCountry('${nation.id.replace(/'/g, "\\'")}')"
            class="w-full flex items-center justify-between px-3.5 py-3 rounded-xl border text-left transition ${
              active
                ? "bg-cyan-500/15 border-cyan-400/50 text-white shadow-lg shadow-cyan-950/30"
                : "glass-card text-slate-200 hover:border-slate-600"
            }"
          >
            <div class="flex items-center gap-3 min-w-0">
              ${renderFlagBadge(nation, "w-7 h-5")}
              <span class="font-semibold text-sm truncate">${nation.name}</span>
            </div>
            <span class="text-xs shrink-0 ${active ? "text-cyan-300" : "text-slate-500"}">▶</span>
          </button>
        `;
      }).join("");
    }

    function renderLeagues() {
      const nation = NATIONS.find(n => n.id === state.selectedCountry) || NATIONS[0];
      document.getElementById("selectedCountryBadge").innerHTML =
        `${renderFlagBadge(nation, "w-5 h-3.5")} <span>${nation.name}</span>`;

      const container = document.getElementById("leaguesList");
      container.innerHTML = nation.leagues.map(lg => {
        const active = lg.code === state.selectedLeagueCode;
        const rounds = state.roundsByLeague[lg.code] || [];
        const currentRoundObj = rounds.find(r => r.roundNumber === state.selectedRound) || rounds[rounds.length - 1];
        const countMatches = currentRoundObj ? currentRoundObj.matches.length : lg.matchesPerRound;

        return `
          <button
            type="button"
            onclick="selectLeague('${lg.code}')"
            class="w-full p-3.5 rounded-xl border text-left transition ${
              active
                ? "bg-cyan-500/15 border-cyan-400/50 text-white"
                : "glass-card text-slate-200 hover:border-slate-600"
            }"
          >
            <div class="flex items-center justify-between mb-1">
              <span class="inline-flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-slate-800 text-cyan-300">
                ${renderFlagBadge(nation, "w-4 h-3")}
                <span>${lg.tier}</span>
              </span>
              <span class="text-[11px] text-slate-400">${countMatches} partite</span>
            </div>
            <div class="font-bold text-base">${lg.name}</div>
          </button>
        `;
      }).join("");
    }

    function renderPickBox(title, picks) {
      const body = (picks && picks.length)
        ? picks.map(pk => `
            <div class="flex items-center gap-1 text-xs whitespace-nowrap leading-snug">
              <span class="font-extrabold text-white">${pk.label}:</span>
              ${renderPctText(pk.pct)}
            </div>
          `).join("")
        : `<div class="text-sm text-slate-500 py-2">—</div>`;
      return `
        <div class="px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-700/80 min-w-[118px]">
          <div class="text-[10px] uppercase tracking-wider text-cyan-300 font-semibold text-center mb-1 border-b border-slate-700/70 pb-0.5">${title}</div>
          <div class="space-y-0.5">${body}</div>
        </div>
      `;
    }

    function renderFormPills(arr) {
      return (arr || []).slice(-5).map(res => {
        const italianLabel = res === "W" ? "V" : res === "D" ? "P" : "S";
        return `<span class="form-pill form-${res}" title="${italianLabel}">${italianLabel}</span>`;
      }).join("");
    }

    function renderMatches() {
      const meta = getLeagueMeta(state.selectedLeagueCode);
      const rounds = state.roundsByLeague[state.selectedLeagueCode] || [];
      const roundObj = rounds.find(r => r.roundNumber === state.selectedRound) || rounds[0];

      document.getElementById("currentLeagueTitle").innerHTML = `
        ${renderFlagBadge(meta.nation, "w-6 h-4")}
        <span>${meta.name}</span>
        <span class="inline-flex items-center gap-1.5 text-xs font-normal text-slate-400">
          (${meta.country} • ${meta.tier})
        </span>
      `;

      const roundSelect = document.getElementById("roundSelect");
      roundSelect.innerHTML = rounds.map(r =>
        `<option value="${r.roundNumber}" ${r.roundNumber === (roundObj && roundObj.roundNumber) ? "selected" : ""}>${r.label}</option>`
      ).join("");

      let matches = roundObj ? [...roundObj.matches] : [];
      if (state.viewMode === "chrono") {
        matches.sort((a, b) => matchSortKey(a) - matchSortKey(b));
      } else {
        matches.sort((a, b) => b.diffForm - a.diffForm);
      }
      updateViewSwitchUI();
      const orderLabel = state.viewMode === "chrono" ? "ordine cronologico" : "differenza di forma";
      const todayStr = getTodayStr();
      document.getElementById("currentLeagueSubtitle").textContent =
        `${roundObj ? roundObj.label : "Giornata"} • ${matches.length} partite • ${orderLabel} • Clicca una card per le statistiche`;

      const listEl = document.getElementById("matchesList");
      if (!matches.length) {
        listEl.innerHTML = `<div class="glass-card rounded-xl p-6 text-center text-sm text-slate-400">Nessuna partita disponibile per questa giornata.</div>`;
        return;
      }

      listEl.innerHTML = matches.map(m => {
        const dateTimeStr = [m.date, m.time].filter(Boolean).join(" • ");
        const isDiffBomb = clampPct(m.diffForm) >= 90;
        const isToday = m.date === todayStr;
        const isPlayed = !!m.ftResult;
        const picks = (typeof window.computeMatchTopPicks === "function")
          ? window.computeMatchTopPicks(m, state.selectedLeagueCode, state.resultsRows)
          : { real: [], dixon: [] };
        return `
          <div
            onclick="openMatchStats('${m.id}')"
            role="button"
            tabindex="0"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openMatchStats('${m.id}');}"
            class="glass-card rounded-xl p-3.5 hover:border-cyan-400/50 hover:bg-slate-900/80 transition cursor-pointer ${isPlayed ? "match-played" : ""} ${!isPlayed && isToday ? "today-match" : ""}"
          >
            <div class="flex flex-col gap-3">
              <div class="text-left w-full">
                <div class="flex items-center gap-2 text-sm font-bold text-white">
                  ${renderFlagBadge(meta.nation, "w-4 h-3")}
                  <span>${m.home}</span>
                  <span class="text-slate-500 font-normal">vs</span>
                  <span>${m.away}</span>
                </div>
                <div class="text-[11px] text-slate-400 mt-0.5 flex items-center flex-wrap gap-2">
                  <span>${dateTimeStr || "Programma campionato"}</span>
                  ${isPlayed ? `
                    <span class="match-result-badge">
                      <span class="ft-label">FT</span>
                      <span>${m.ftResult}</span>
                    </span>
                  ` : (isPastDate(m.date) ? `
                    <span class="match-result-badge" style="color:#fbbf24;border-color:rgba(251,191,36,0.45)">
                      <span class="ft-label">Risultato in attesa di aggiornamento</span>
                    </span>
                  ` : "")}
                </div>
              </div>

              <!-- Stato di forma ultime 5 partite + Differenza positiva -->
              <div class="flex items-center gap-3 flex-wrap">
                <div class="text-left">
                  <div class="text-[10px] uppercase tracking-wider text-slate-400">Stato di forma (ult. 5)</div>
                  <div class="flex items-center gap-2 mt-1">
                    <div class="flex items-center gap-1">${renderFormPills(m.homeFormArr)}</div>
                    <span class="text-[11px]">${renderPctText(m.homeForm)}</span>
                    <span class="text-slate-600">|</span>
                    <div class="flex items-center gap-1">${renderFormPills(m.awayFormArr)}</div>
                    <span class="text-[11px]">${renderPctText(m.awayForm)}</span>
                  </div>
                </div>

                <div class="px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-700/80 text-center min-w-[84px] ${isDiffBomb ? "flag-bomb" : ""}">
                  <div class="text-[10px] uppercase tracking-wider text-slate-300 font-semibold">Diff. Forma</div>
                  <div class="text-sm mt-0.5">${renderPctText(m.diffForm)}</div>
                </div>

                ${renderPickBox("Reali", picks.real)}
                ${renderPickBox("Dixon-Cole", picks.dixon)}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    function openMatchStats(matchId) {
      const meta = getLeagueMeta(state.selectedLeagueCode);
      const rounds = state.roundsByLeague[state.selectedLeagueCode] || [];
      let foundMatch = null;
      let foundRound = null;

      for (const r of rounds) {
        const hit = r.matches.find(x => x.id === matchId);
        if (hit) {
          foundMatch = hit;
          foundRound = r;
          break;
        }
      }
      if (!foundMatch || typeof window.openMatchStatsScreen !== "function") return;

      window.openMatchStatsScreen({
        match: foundMatch,
        roundNumber: foundRound ? foundRound.roundNumber : state.selectedRound,
        roundLabel: foundRound ? foundRound.label : `Giornata ${state.selectedRound}`,
        leagueCode: meta.code,
        leagueName: meta.name,
        countryName: meta.country,
        flagHtml: renderFlagBadge(meta.nation, "w-5 h-3.5"),
        resultsRows: state.resultsRows,
        fixturesRows: state.fixturesRows
      });
    }

    function selectCountry(countryId) {
      state.selectedCountry = countryId;
      const nation = NATIONS.find(n => n.id === countryId);
      if (nation && nation.leagues.length) {
        state.selectedLeagueCode = nation.leagues[0].code;
        const rounds = state.roundsByLeague[state.selectedLeagueCode] || [];
        state.selectedRound = rounds.length ? rounds[rounds.length - 1].roundNumber : 1;
      }
      renderAll();
    }

    function selectLeague(code) {
      state.selectedLeagueCode = code;
      const rounds = state.roundsByLeague[code] || [];
      state.selectedRound = rounds.length ? rounds[rounds.length - 1].roundNumber : 1;
      renderAll();
    }

    function selectRound(roundNum) {
      state.selectedRound = Number(roundNum);
      renderMatches();
    }

    function changeRound(delta) {
      const rounds = state.roundsByLeague[state.selectedLeagueCode] || [];
      if (!rounds.length) return;
      const idx = rounds.findIndex(r => r.roundNumber === state.selectedRound);
      const nextIdx = Math.max(0, Math.min(rounds.length - 1, idx + delta));
      state.selectedRound = rounds[nextIdx].roundNumber;
      renderMatches();
    }

    function renderAll() {
      renderCountries();
      renderLeagues();
      renderMatches();
    }

    window.addEventListener("DOMContentLoaded", () => {
      updateClock();
      setInterval(updateClock, 1000);
      autoLoadComboGesssData();
    });

    // scanline dinamica per il layer tecnologico
    (function initTechBg() {
      const layer = document.getElementById('techBgLayer');
      if (!layer) return;
      const line = document.createElement('div');
      line.className = 'cgScanline';
      layer.appendChild(line);

      // piccolo "hex grid" decorativo in alto a destra, opzionale
      const hex = document.createElement('div');
      hex.style.cssText = `
        position:absolute; top:8%; right:6%; width:180px; height:180px;
        background-image: radial-gradient(circle, rgba(34,211,238,0.25) 1px, transparent 1.5px);
        background-size: 14px 14px;
        mask-image: radial-gradient(circle at center, #000 30%, transparent 70%);
        -webkit-mask-image: radial-gradient(circle at center, #000 30%, transparent 70%);
        opacity:0.6; pointer-events:none;
      `;
      layer.appendChild(hex);
    })();
  </script>

  <script src="./statistiche-partita.js"></script>
</body>
